[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge8"
version = "0.1.0.dev0"
description = "Local source-reading desk and bounded code repair for 8 GB GPUs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Forge8 contributors" }]
keywords = ["local-llm", "repository-repair", "code-understanding", "llama.cpp", "verification"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
pytest = [
  "pytest==9.1.1",
  "colorama==0.4.6; sys_platform == 'win32'",
  "exceptiongroup==1.3.1; python_version < '3.11'",
  "iniconfig==2.3.0",
  "packaging==26.3",
  "pluggy==1.6.0",
  "pygments==2.21.0",
  "tomli==2.4.1; python_version < '3.11'",
  "typing-extensions==4.16.0; python_version < '3.11'",
]

[project.scripts]
forge8 = "forge8.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge8 = ["web/*.html", "web/*.css", "web/*.js"]
