name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: python -B -m unittest discover -s tests
      - name: Windows setup fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_setup.ps1
      - name: Browser logic
        shell: bash
        run: |
          node tests/test_desk_ui.cjs
          node tests/web_changes_test.js
          node tests/web_experiment_trace_test.cjs
          node tests/web_keyword_search_test.cjs
          node tests/web_reading_note_test.cjs
          node tests/web_reading_note_ui_test.cjs
          node tests/web_call_search_test.cjs
